name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-rerunfailures pytest-github-actions-annotate-failures cryptography tzdata tensorboard
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: tests (everything but the slow ones; includes the Docker wire test)
        run: |
          set -o pipefail
          # Two tests assert a parallel speed-up in wall time; a shared runner can miss it once.
          COLUMNS=2000 python -m pytest -q -m "not slow" -rfE --reruns 2 2>&1 | tee not-slow.log
      - name: slow tests (real subprocess lifecycles, a real compile)
        if: always()
        run: |
          set -o pipefail
          COLUMNS=2000 python -m pytest -q -m slow -rfE 2>&1 | tee slow.log
      # Job logs need a login even on a public repository; annotations do not. Name what failed.
      - name: name the failing tests
        if: failure()
        run: |
          python - <<'EOF'
          import pathlib, re
          for log in ("not-slow.log", "slow.log"):
              p = pathlib.Path(log)
              if not p.exists():
                  continue
              text = p.read_text(errors="replace")
              failed = re.findall(r"^(?:FAILED|ERROR) (\S+)(?: - (.*))?$", text, re.M)
              lines = [f"{test} :: {(why or '')[:1600]}" for test, why in failed[:40]]
              tail = text.strip().splitlines()[-1] if text.strip() else ""
              body = "\n".join(lines + [tail]) or "no FAILED lines"
              body = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=failing tests in {log} ({len(failed)})::{body}")
          EOF

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the single-machine demo runs three jobs to done
        run: demo/local_demo.sh "$RUNNER_TEMP/fleet-demo"
