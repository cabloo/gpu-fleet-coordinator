name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography tzdata tensorboard
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: tests (everything but the slow ones; includes the Docker wire test)
        run: python -m pytest -q -m "not slow"
      - name: slow tests (real subprocess lifecycles, a real compile)
        run: python -m pytest -q -m slow

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the single-machine demo runs three jobs to done
        run: demo/local_demo.sh "$RUNNER_TEMP/fleet-demo"
