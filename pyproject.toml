[project]
name = "gpu-fleet-coordinator"
version = "0.1.0"
description = "A cost-aware job queue that packs many small checkpointed experiments onto each GPU, across owned machines and Vast.ai rentals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The coordinator, the worker and the queue client run on the standard library alone.
sign = ["cryptography"]      # ed25519 bundle signatures
compile = ["cython"]         # ship compiled extension modules instead of source
dev = ["pytest", "cryptography", "tzdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["fleet", "tests"]
markers = [
    "slow: exercises a real subprocess lifecycle (spool worker claim/run/DONE) — seconds, not ms",
]
