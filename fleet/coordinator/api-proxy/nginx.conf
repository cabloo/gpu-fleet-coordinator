# coord-api-proxy — mutual TLS in stock nginx (remote-submit spec, M1).
#
# This file IS the authentication. The application behind it parses no credential: it receives the
# identity nginx verified, over a unix socket nothing else can reach. Everything here is a core
# directive — certificate verification, revocation, body caps, timeouts, rate limits, route
# allowlisting — so none of it is code we wrote.
#
# ⛔ `ssl_verify_client on` is the whole boundary. `optional` would let an unauthenticated request
#    reach the app with X-Client-Verify: NONE, and the app would refuse it — but the handshake
#    should never get that far. A config test asserts `on` and the absence of `optional`.
# ⚠ AN EXPIRED CRL REJECTS EVERY CLIENT. `api_pki.sh` writes a 365-day CRL and regenerates it on
#    every issue/revoke, plus a monthly timer, because the failure mode is total.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  access_log /dev/stdout combined;
  server_tokens off;

  # Per-CERTIFICATE, not per-IP: the identity is the certificate, and OQ13 makes network position
  # meaningless, so an address-keyed limit would be both wrong and evadable.
  limit_req_zone $ssl_client_serial zone=percert:1m rate=30r/m;

  client_body_timeout   30s;
  client_header_timeout 30s;
  send_timeout          30s;

  upstream coord_api { server unix:/run/coord-api/api.sock; }

  server {
    listen 8443 ssl;
    http2 off;

    ssl_certificate         /run/secrets/api/server.pem;
    ssl_certificate_key     /run/secrets/api/server.key;
    ssl_protocols           TLSv1.3;
    ssl_client_certificate  /run/secrets/api/ca.pem;
    ssl_crl                 /run/secrets/api/crl.pem;
    ssl_verify_client       on;
    ssl_verify_depth        1;
    ssl_session_cache       shared:api:1m;

    # A certificate fault is nginx's internal 495/496; return the app's JSON shape so the client
    # maps it like any other refusal (exit 7) instead of parsing an HTML error page.
    error_page 495 496 = @client_cert;
    location @client_cert {
      default_type application/json;
      return 403 '{"ok":false,"code":"client_cert","error":"a valid client certificate is required"}';
    }

    # The identity the app trusts. SET on every request, so whatever a client sent is discarded.
    proxy_set_header X-Client-Verify $ssl_client_verify;
    proxy_set_header X-Client-DN     $ssl_client_s_dn;
    proxy_set_header X-Client-Serial $ssl_client_serial;
    proxy_http_version 1.1;

    # ROUTE ALLOWLIST. Anything not named here is 404 at the proxy and never reaches the app.
    location = /v1/ping        { limit_except GET  { deny all; } proxy_pass http://coord_api; }
    location = /v1/submissions { limit_except POST { deny all; }
                                 client_max_body_size 16m;
                                 limit_req zone=percert burst=20 nodelay;
                                 proxy_pass http://coord_api; }
    location = /v1/boxes       { limit_except POST { deny all; }
                                 client_max_body_size 16m;
                                 limit_req zone=percert burst=20 nodelay;
                                 proxy_pass http://coord_api; }
    location = /v1/roll-now    { limit_except POST { deny all; }
                                 client_max_body_size 16m;
                                 limit_req zone=percert burst=20 nodelay;
                                 proxy_pass http://coord_api; }
    location ~ "^/v1/blobs/[0-9a-f]{8,64}$" {
      limit_except GET PUT { deny all; }
      client_max_body_size 256m;
      proxy_request_buffering off;        # a blob streams to the app, not to the proxy's disk
      limit_req zone=percert burst=20 nodelay;
      proxy_pass http://coord_api;
    }
    location ~ ^/v1/tasks/[A-Za-z0-9-]+/cancel$ {
      limit_except POST { deny all; }
      client_max_body_size 16m;
      limit_req zone=percert burst=20 nodelay;
      proxy_pass http://coord_api;
    }
    location ~ ^/v1/boxes/[A-Za-z0-9_.-]+/(probe|pause|hold|drain|resume)$ {
      limit_except POST { deny all; }
      client_max_body_size 16m;
      limit_req zone=percert burst=20 nodelay;
      proxy_pass http://coord_api;
    }
    location / { return 404 '{"ok":false,"code":"not_found","error":"no such route"}'; }
  }
}
